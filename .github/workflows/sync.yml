name: Automated Renpho Garmin Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Wakes up automatically every 6 hours
  workflow_dispatch:     # Keeps your manual run button active

jobs:
  sync-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Sync Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests garminconnect renpho-api garth==0.6.3 cloudscraper curl_cffi

      # 👇 STEP 1: Connects to Renpho and saves your weight data to a local text file
      - name: Download Renpho Scale Metrics
        run: |
          python sync_script.py \
            --renpho-email "${{ secrets.RENPHO_EMAIL }}" \
            --renpho-password "${{ secrets.RENPHO_PASSWORD }}"

      # 👇 STEP 2: Reads the text file and passes variables into the isolated Garmin script
      - name: Upload Metrics to Garmin Connect
        run: |
          # Read saved string and parse into variables
          METRICS=$(cat metrics.txt)
          WEIGHT=$(echo $METRICS | cut -d',' -f1)
          FAT=$(echo $METRICS | cut -d',' -f2)
          BMI=$(echo $METRICS | cut -d',' -f3)
          
          python upload_garmin.py \
            --garmin-email "${{ secrets.GARMIN_EMAIL }}" \
            --garmin-password "${{ secrets.GARMIN_PASSWORD }}" \
            --weight "$WEIGHT" \
            --fat "$FAT" \
            --bmi "$BMI"
