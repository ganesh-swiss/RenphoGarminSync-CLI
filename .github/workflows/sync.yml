name: Automated Renpho Garmin Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Wakes up automatically every 6 hours
  workflow_dispatch:     # Keeps your manual run button active

jobs:
  sync-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

       - name: Validate Secrets
  run: |
    if [ -z "${{ secrets.RENPHO_EMAIL }}" ] || [ -z "${{ secrets.RENPHO_PASSWORD }}" ]; then
      echo "Error: RENPHO_EMAIL or RENPHO_PASSWORD secrets are not configured"
      exit 1

      - name: Install Sync Dependencies
        run: |
          pip install requests
          pip install garminconnect
   
      - name: Run Cloud Synchronization
        run: |
          python sync_script.py --renpho-email "${{ secrets.RENPHO_EMAIL }}" --renpho-password "${{ secrets.RENPHO_PASSWORD }}" --garmin-email "${{ secrets.GARMIN_EMAIL }}" --garmin-password "${{ secrets.GARMIN_PASSWORD }}"

